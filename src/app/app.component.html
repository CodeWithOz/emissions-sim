<div class="calculator-container">
  <div class="form-section">
    <div class="header">
      <h1>Emission Calculator</h1>
    </div>

    <div class="input-group">
      <div class="input-row">
        <input 
          type="number" 
          [(ngModel)]="tonnage" 
          placeholder="Number of tonnes"
          class="location-input"
        />
        <select [(ngModel)]="freightUnit" class="location-input">
          <option value="tonnes">tonnes</option>
          <option value="kg">kg</option>
        </select>
      </div>
    </div>

    <div class="locations-container">
      <div *ngFor="let location of locations; let i = index" class="location-group">
        <div class="location-row">
          <div class="location-pin-line">
            <div class="pin-icon">📍</div>
            <div class="vertical-line" *ngIf="i < locations.length - 1"></div>
          </div>
          <div class="location-content">
            <input 
              type="text" 
              [(ngModel)]="location.address"
              placeholder="Location"
              class="location-input"
              list="countries"
              (input)="onLocationInput(i, location.address)"
            />
          </div>
        </div>

        <!-- Transport options between locations -->
        <div class="transport-section" *ngIf="i < locations.length - 1">
          <div class="transport-options">
            <div class="transport-icons-group">
              <button 
                *ngFor="let transport of transportOptions"
                class="transport-option"
                [class.selected]="location.selectedTransport === transport.id"
                [class.selected-state]="location.selectedTransport === transport.id"
                (click)="selectTransport(i, transport.id)"
              >
                {{ transport.emoji }}
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Add location button -->
      <div class="add-location-row">
        <div class="pin-placeholder">
          <button class="add-location-button" (click)="addLocation()">
            <span class="plus-icon">+</span>
          </button>
        </div>
      </div>
    </div>

    <button class="calculate-button" (click)="calculate()">
      Calculate emissions
    </button>
  </div>

  <div class="results-section" *ngIf="emissionResults.showResults">
    <h2 class="results-title">Total Emission</h2>
    
    <div class="results-container">
      <div class="results-group">
        <h3 class="group-title">Greenhouse Gases</h3>
        <div class="metrics-container">
          <div class="metric-card">
            <div class="metric-icon">☁️</div>
            <div class="metric-details">
              <div class="metric-label">CO2e [kg] WtW</div>
              <div class="metric-value">{{emissionResults.co2e}}</div>
            </div>
          </div>

          <div class="metric-card">
            <div class="metric-icon">☁️</div>
            <div class="metric-details">
              <div class="metric-label">CO2e Intensity [g CO2e/tonne-km]</div>
              <div class="metric-value">{{emissionResults.co2eIntensity}}</div>
            </div>
          </div>
        </div>
      </div>

      <div class="results-group">
        <h3 class="group-title">Mobility</h3>
        <div class="metrics-container">
          <div class="metric-card">
            <div class="metric-icon">🏁</div>
            <div class="metric-details">
              <div class="metric-label">Distance [km]</div>
              <div class="metric-value">{{emissionResults.distance}}</div>
            </div>
          </div>

          <div class="metric-card">
            <div class="metric-icon">⏱️</div>
            <div class="metric-details">
              <div class="metric-label">Transport Activity [tonne-km]</div>
              <div class="metric-value">{{emissionResults.transportActivity}}</div>
            </div>
          </div>
        </div>
      </div>

      <button class="detailed-results-button">Detailed Results</button>
    </div>
  </div>

  <!-- Datalist for country suggestions -->
  <datalist id="countries">
    <option *ngFor="let country of countries" [value]="country">
  </datalist>

  <div class="map-section" id="map"></div>
</div>
